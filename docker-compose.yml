services:
  postgres:
    image: postgres:15-alpine
    container_name: claimbridge-postgres
    environment:
      POSTGRES_USER: claimbridge
      POSTGRES_PASSWORD: claimbridge_password
      POSTGRES_DB: claimbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimbridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    # Consider pinning a version (e.g. :1.28.4) instead of :latest so a server
    # upgrade can't silently break compatibility with weaviate-client 4.23.1.
    image: semitechnologies/weaviate:latest
    container_name: claimbridge-weaviate
    ports:
      - "8080:8080"
      # The v4 Python client queries over gRPC, not HTTP. Without 50051 the
      # client connects, then every query times out -- a confusing failure.
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      DEFAULT_VECTORIZER_MODULE: text2vec-openai
      # DEFAULT_VECTORIZER_MODULE names the module; ENABLE_MODULES actually
      # loads it. Without this line text2vec-openai is not available and
      # every insert fails with "no module with name text2vec-openai".
      ENABLE_MODULES: text2vec-openai
      # The vectorizer runs inside Weaviate, so Weaviate needs the OpenAI key.
      OPENAI_APIKEY: ${OPENAI_API_KEY:-}
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  claimbridge:
    build: .
    container_name: claimbridge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://claimbridge:claimbridge_password@postgres:5432/claimbridge
      WEAVIATE_URL: http://weaviate:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      # Must be a model that supports response_format json_object.
      # The original gpt-4 does NOT -- use gpt-4o-mini or gpt-4o.
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      # Provided spec resources (tenant policies, CARC/RARC reference, golden
      # evals). Read-only: the app ingests and reads them, never modifies them.
      - ./resources:/app/resources:ro
      # Migrations, so schema changes apply without rebuilding the image.
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      # Golden eval reports land in the project folder; tests are mounted so
      # pytest runs inside the container against the same code.
      - ./eval-reports:/app/eval-reports
      - ./tests:/app/tests

volumes:
  postgres_data:
  weaviate_data:
